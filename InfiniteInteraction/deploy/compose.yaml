name: infinite-interaction-production

x-runtime-environment: &runtime-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  MODEL_CONFIGURATION_ENABLED: ${MODEL_CONFIGURATION_ENABLED:-false}
  MODEL_ALLOWED_ORIGINS_JSON: ${MODEL_ALLOWED_ORIGINS_JSON:-[]}
  MODEL_CREDENTIAL_ACTIVE_KEY: ${MODEL_CREDENTIAL_ACTIVE_KEY:-}
  MODEL_CREDENTIAL_KEYS_JSON: ${MODEL_CREDENTIAL_KEYS_JSON:-{}}
  VIDEO_CONFIRM_ENABLED: ${VIDEO_CONFIRM_ENABLED:-false}
  VIDEO_PROVIDER_SUBMIT_ENABLED: ${VIDEO_PROVIDER_SUBMIT_ENABLED:-false}
  VIDEO_PROVIDER_QUERY_ENABLED: ${VIDEO_PROVIDER_QUERY_ENABLED:-false}
  VIDEO_RESULT_INGEST_ENABLED: ${VIDEO_RESULT_INGEST_ENABLED:-false}
  IMAGE_CONFIRM_ENABLED: ${IMAGE_CONFIRM_ENABLED:-false}
  IMAGE_PROVIDER_SUBMIT_ENABLED: ${IMAGE_PROVIDER_SUBMIT_ENABLED:-false}
  IMAGE_RESULT_INGEST_ENABLED: ${IMAGE_RESULT_INGEST_ENABLED:-false}

x-service: &service
  build:
    context: ..
    target: worker
  environment: *runtime-environment
  init: true
  read_only: true
  restart: unless-stopped
  tmpfs:
    - /tmp:size=256m,mode=1777

services:
  migrate:
    <<: *service
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  web:
    build:
      context: ..
      target: web
    environment: *runtime-environment
    init: true
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  media-worker:
    <<: *service
    command: ["npm", "run", "worker:media"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  generation-worker:
    <<: *service
    command: ["npm", "run", "worker:generation"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  publish-worker:
    <<: *service
    command: ["npm", "run", "worker:publish"]
    depends_on:
      migrate:
        condition: service_completed_successfully
